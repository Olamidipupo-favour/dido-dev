<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    />
    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js/"">
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>Decentralized Donation Hub: Create an account</title>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6 col-md-7 intro-section">
          <div class="brand-wrapper">
            <a href="index.html"><img src="img/logo/logo.png" alt="" /></a>
          </div>
          <div class="intro-content-wrapper">
            <h1 class="intro-title">Welcome to website !</h1>
            <p class="intro-text">
              Welcome to DiDo - Decentralized Donating system, where you can
              make a difference through blockchain technology.
            </p>
            <a href="./about.html" class="btn btn-read-more">Read more</a>
          </div>
          <div class="intro-section-footer">
            <na class="footer-nav">
              <a href="#!">Facebook</a>
              <a href="#!">Twitter</a>
              <a href="#!">Gmail</a>
            </na>
          </div>
        </div>
        <div class="col-sm-6 col-md-5 form-section">
          <div class="login-wrapper">
            <h2 class="login-title">Sign Up</h2>
            <form action="#!">
              <div class="form-group">
                <label for="fullname" class="sr-only">Fullname</label>
                <input
                  type="text"
                  name="fullname"
                  id="fullname"
                  class="form-control"
                  placeholder="Full name"
                />
              </div>
              <div class="form-group">
                <label for="email" class="sr-only">Email</label>
                <input
                  type="email"
                  name="email"
                  id="email"
                  class="form-control"
                  placeholder="Email"
                />
              </div>
              <div class="form-group">
                <label for="phone" class="sr-only">Oxadress</label>
                <input
                  type="phone"
                  name="phone"
                  id="oxa"
                  class="form-control"
                  placeholder="ox......."
                  disabled
                />
              </div>
              <div class="form-group mb-3">
                <label for="password" class="sr-only">Password</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  class="form-control"
                  placeholder="Password"
                />
              </div>
              <div
                class="d-flex justify-content-between align-items-center mb-5"
              >
                <input
                  name="signup"
                  id="signup"
                  class="btn login-btn py-3"
                  type="button"
                  value="Signup"
                />
              </div>
            </form>
            <p class="login-wrapper-footer-text">
              Already have an account?
              <a href="./login.html" class="text-reset">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    document.getElementById("oxa").value=window.sessionStorage.getItem("account");
    document.getElementById("signup").addEventListener("click", function () {
      let fullname = document.getElementById("fullname").value;
      let email = document.getElementById("email").value;
      document.getElementById("oxa").value=window.sessionStorage.getItem("account");
      let oxa = document.getElementById("oxa").value;
      let password = document.getElementById("password").value;
      let url = "https://dido-dev-backend.onrender.com";
      fetch(`${url}/api/register`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          name: fullname,
          username: email,
          password: password,
          oxadress: oxa,
        }),
      })
        .then((response) => response.json())
        .then((data) => {
            //alert("Signup successful");
            window.location.href = "./login";
        });
    });
  </script>
</html>
